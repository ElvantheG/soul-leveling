function renderXpChart() {
  const now=new Date();
  const days=30;
  const data=[];
  let cumXp=0;
  // Build cumulative XP per day (approximate from completedDates)
  for(let i=days-1;i>=0;i--){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    const dayDone=(S.completedDates[ds]||[]).length;
    cumXp+=dayDone*35; // approximate XP per quest
    data.push({day:d.getDate(),xp:cumXp,done:dayDone});
  }
  const maxXp=Math.max(...data.map(d=>d.xp),1);
  const w=480,h=180,pad=30;
  const points=data.map((d,i)=>{
    const x=pad+i*((w-pad*2)/(days-1));
    const y=h-pad-(d.xp/maxXp)*(h-pad*2);
    return `${x},${y}`;
  }).join(' ');

  let svg=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="xpGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--gold)" stop-opacity=".3"/>
      <stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="${pad},${h-pad} ${points} ${w-pad},${h-pad}" fill="url(#xpGrad)"/>
    <polyline points="${points}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round"/>`;
  // Axis labels
  for(let i=0;i<days;i+=7){
    const x=pad+i*((w-pad*2)/(days-1));
    svg+=`<text x="${x}" y="${h-8}" fill="var(--text-dim)" font-size="8" text-anchor="middle">${data[i].day}</text>`;
  }
  svg+=`<text x="${pad-5}" y="${pad}" fill="var(--text-dim)" font-size="8" text-anchor="end">${maxXp}</text>`;
  svg+=`<text x="${pad-5}" y="${h-pad}" fill="var(--text-dim)" font-size="8" text-anchor="end">0</text>`;
  svg+=`</svg>`;

  let out=`<div class="sec-title">📈 XP Trend (30 dage)</div><div class="card">${svg}</div>`;

  // Category balance radar (simplified as bar chart)
  out+=`<div class="sec-title" style="margin-top:14px">⚖️ Kategori Balance</div><div class="card">`;
  const allCats=getAllCats();
  const maxCatXp=Math.max(...allCats.map(c=>S.categoryXp[c.id]||0),1);
  allCats.forEach(cat=>{
    const xp=S.categoryXp[cat.id]||0;
    const pct=Math.round(xp/maxCatXp*100);
    out+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span style="font-size:14px;min-width:20px">${cat.icon}</span>
      <span style="font-size:11px;color:var(--text);min-width:80px">${cat.name}</span>
      <div style="flex:1;height:10px;background:rgba(0,0,0,.3);border-radius:5px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:${cat.color};border-radius:5px;transition:width .5s"></div></div>
      <span style="font-size:10px;color:${cat.color};font-weight:700;min-width:50px;text-align:right">${xp.toLocaleString()}</span>
    </div>`;

// ── #8: Pomodoro Timer ──
let _pomoInterval=null;
let _pomoSeconds=0;
let _pomoTotal=25*60;
let _pomoQuest=null;

function startPomodoro(questId,minutes) {
  _pomoQuest=questId;
  _pomoTotal=(minutes||25)*60;
  _pomoSeconds=_pomoTotal;
  S.pomodoroActive=true;
  clearInterval(_pomoInterval);
  _pomoInterval=setInterval(()=>{
    _pomoSeconds--;
    if(_pomoSeconds<=0){
      clearInterval(_pomoInterval);
      S.pomodoroActive=false;
      notify('🍅 Pomodoro done! Tid til pause.','levelup');
      if(S.soundOn) AudioFX.play('loot');
      if(_pomoQuest && !S.completedToday[_pomoQuest]){
        // Auto-complete quest
        completeQuest(_pomoQuest);
      }
      render();
    }
    // Update timer display
    const el=document.getElementById('pomo-display');
    if(el){
      const m=Math.floor(_pomoSeconds/60), s=_pomoSeconds%60;
      el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
      const prog=document.getElementById('pomo-progress');
      if(prog) prog.style.width=(1-_pomoSeconds/_pomoTotal)*100+'%';
    }
  },1000);
  render();
}

function stopPomodoro() {
  clearInterval(_pomoInterval);
  S.pomodoroActive=false;
  _pomoSeconds=0;
  render();
}

function renderPomodoro() {
  const m=Math.floor(_pomoSeconds/60), s=_pomoSeconds%60;
  let h=`<div class="sec-title">🍅 Pomodoro Timer</div>`;
  if(S.pomodoroActive){
    const pct=(1-_pomoSeconds/_pomoTotal)*100;
    h+=`<div class="card" style="text-align:center;border-color:rgba(232,93,74,.3)">
      <div id="pomo-display" style="font-size:48px;font-weight:800;color:var(--danger);font-family:monospace;letter-spacing:2px">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div>
      <div style="width:100%;height:6px;background:rgba(0,0,0,.3);border-radius:3px;overflow:hidden;margin:12px 0">
        <div id="pomo-progress" style="width:${pct}%;height:100%;background:var(--danger);border-radius:3px;transition:width 1s linear"></div></div>
      <button class="btn-del" style="width:100%" onclick="stopPomodoro()">⏹️ Stop</button>
    </div>`;
  } else {
    h+=`<div class="card">
      <div style="font-size:11px;color:var(--text-dim);margin-bottom:10px">Vælg en quest og start en fokus-session.</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
        ${[15,25,45,60].map(m=>`<button class="biz-btn" onclick="startPomodoro(null,${m})">${m} min</button>`).join('')}

      <div style="font-size:10px;color:var(--text-dim)">Eller start fra en quest — tryk på ⏱️ ikonet.</div>
    </div>`;
  }
  return h;
}

function isQuestUnlocked(quest) {
  if(!S.questPrereqs) return true;
  const prereqId=S.questPrereqs[quest.id];

}

// ── #14: Moon Phase ──
function getMoonPhase() {
  const now=new Date();
  const year=now.getFullYear(),month=now.getMonth()+1,day=now.getDate();
  // Moon phase calculation
  let c=0,e=0,jd=0,b=0;
  if(month<3){c=year-1;e=month+12;}else{c=year;e=month;}
  jd=Math.floor(365.25*(c+4716))+Math.floor(30.6001*(e+1))+day-1524.5;
  b=(jd-2451550.1)/29.530588853;
  b=b-Math.floor(b);
  const phase=Math.round(b*8)%8;
  const phases=['🌑 Nymåne','🌒 Tiltagende','🌓 Første Kvarter','🌔 Tiltagende Gibbøs',
    '🌕 Fuldmåne','🌖 Aftagende Gibbøs','🌗 Sidste Kvarter','🌘 Aftagende'];
  const meanings=['Ny begyndelse. Sæt intentioner.','Momentum bygger. Hold kursen.',
    'Handling. Overvind modstand.','Forfin og justér.','Høst. Fejr. Reflektér.',
    'Giv tilbage. Del din visdom.','Slip. Lad gå af det der ikke tjener dig.',
    'Hvil. Forbered det nye.'];
  // Calculate next new moon and full moon
  const SYNODIC=29.530588853;
  var cyclePos=b*SYNODIC; // days into current cycle
  var daysToNew=SYNODIC-cyclePos; // new moon = cycle pos 0
  var daysToFull=(SYNODIC/2)-cyclePos; // full moon = cycle pos ~14.76
  if(daysToFull<0) daysToFull+=SYNODIC;
  var nextNew=new Date(now.getTime()+daysToNew*86400000);
  var nextFull=new Date(now.getTime()+daysToFull*86400000);
  var mn=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
  return {emoji:phases[phase].split(' ')[0],name:phases[phase],meaning:meanings[phase],phase,
    nextNew:nextNew.getDate()+'. '+mn[nextNew.getMonth()],
    nextFull:nextFull.getDate()+'. '+mn[nextFull.getMonth()],
    daysToNew:Math.round(daysToNew),daysToFull:Math.round(daysToFull)};
}

// ── #18: Voice Notes (MediaRecorder API) ──
let _mediaRecorder=null;
let _audioChunks=[];

function startVoiceNote(questId) {
  if(!navigator.mediaDevices){notify('⚠ Mikrofon ikke tilgængelig','boss');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    _mediaRecorder=new MediaRecorder(stream);
    _audioChunks=[];
    _mediaRecorder.ondataavailable=e=>_audioChunks.push(e.data);
    _mediaRecorder.onstop=()=>{
      const blob=new Blob(_audioChunks,{type:'audio/webm'});
      const url=URL.createObjectURL(blob);
      if(!S.voiceNotes) S.voiceNotes={};
      if(!S.voiceNotes[todayStr]) S.voiceNotes[todayStr]=[];
      S.voiceNotes[todayStr].push({questId,url,time:new Date().toLocaleTimeString('da-DK')});
      notify('🎙️ Voice note gemt!','xp');
      stream.getTracks().forEach(t=>t.stop());
      render();
    };
    _mediaRecorder.start();
    notify('🎙️ Optager... Tryk stop når du er færdig','event');
    render();
  }).catch(()=>notify('⚠ Kunne ikke starte mikrofon','boss'));
}

function stopVoiceNote() {
  if(_mediaRecorder && _mediaRecorder.state==='recording'){
    _mediaRecorder.stop();
  }
}

  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if(imported.totalXp !== undefined) {
        Object.assign(S, imported);
        save();
        notify('📥 Data importeret! Genindlæser...', 'levelup');
        setTimeout(()=>location.reload(), 1000);
      } else {
        notify('⚠ Ugyldig fil — mangler Soul Leveling data', 'boss');
      }
    } catch(err) {
      notify('⚠ Kunne ikke læse filen', 'boss');
    }
  };
  reader.readAsText(file);
}

function restoreFromCloud() {
  const rid = document.getElementById('restore_sync_id').value.trim();
  if(!rid) { notify('⚠ Indsæt et Sync ID først', 'boss'); return; }
  if(!confirm('Dette vil overskrive al din nuværende data med data fra den anden enhed. Fortsæt?')) return;
  notify('☁️ Henter data fra skyen...', 'xp');
  loadFromCloud(rid).then(state => {
    if(state && state.totalXp !== undefined) {
      Object.assign(S, state);
      localStorage.setItem('soulLevelingSyncId', rid);
      save();
      notify('✅ Data gendannet! Genindlæser...', 'levelup');
      setTimeout(()=>location.reload(), 1500);
    } else {
      notify('⚠ Ingen data fundet for det Sync ID', 'boss');
    }
  });
}

function resetBizMonth() {
  if(!confirm('Nulstil business stats for denne måned? Nuværende tal gemmes i historik.')) return;
  if(!S.bizHistory) S.bizHistory = [];
  S.bizHistory.push({
    month: todayStr.slice(0,7),
    ...S.businessStats
  });
  S.businessStats = {leads:0, conversations:0, offers:0, sales:0, revenue:0};
  S._bizMonth = todayStr.slice(0,7);
  save();
  notify('🏰 Business stats nulstillet. Historik gemt.', 'xp');
  render();
}

// Auto monthly biz reset check
(function checkBizMonth() {
  const currentMonth = todayStr.slice(0,7);
  if(S._bizMonth && S._bizMonth !== currentMonth) {
    if(!S.bizHistory) S.bizHistory = [];
    S.bizHistory.push({ month: S._bizMonth, ...S.businessStats });
    S.businessStats = {leads:0, conversations:0, offers:0, sales:0, revenue:0};
    S._bizMonth = currentMonth;
    save();
  }
  if(!S._bizMonth) { S._bizMonth = currentMonth; save(); }
})();

// ── Reminder System ──
function initReminders() {
  if(!('Notification' in window)) return;
  if(Notification.permission==='default'){
    // Request on first interaction
    document.addEventListener('click',function reqPerm(){
      Notification.requestPermission();
      document.removeEventListener('click',reqPerm);
    },{once:true});
  }
  // Check reminders every minute
  setInterval(checkReminders, 60000);
}

function checkReminders() {
  if(!S.reminders || Notification.permission!=='granted') return;
  const now=new Date();
  const hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  Object.entries(S.reminders).forEach(([qId,time])=>{
    if(time===hm && !S.completedToday[qId]){
      const q=S.quests.find(x=>x.id==+qId);
      if(q&&q.active&&q.days.includes(now.getDay())){
        const qEmoji=q.emoji||getCat(q.category).icon;
        new Notification('Soul Leveling ⚔️',{
          body:`${qEmoji} Tid til: ${q.title}\n${q.habit?.twoMin||q.description}`,
          icon:'icon-192.png',
          tag:'sl-'+qId
        });
      }
    }
  });
}
initReminders();

S.subView = S.subView || 'quests';

if(!S.meditationLog) S.meditationLog=[];

if(!S.jhanaLevel) S.jhanaLevel=0;
if(!S.reminders) S.reminders={};
if(!S.journal) S.journal={};
if(!S.streakInsurance) S.streakInsurance=0;
if(!S.lang) S.lang='da';
if(!S.customCats) S.customCats=[];
if(!S.questPrereqs) S.questPrereqs={};
if(!S.onboardingDone) S.onboardingDone=false;
if(!S.pomodoroActive) S.pomodoroActive=false;
// Apply saved theme
if(S.lightMode) document.body.classList.add('light-mode');
// Check weekly review (Sunday evenings)
setTimeout(checkWeeklyReview, 3000);
render();
