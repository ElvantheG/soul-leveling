<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Soul Leveling</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soul Leveling">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#1a1a2e;--bg2:#0f0f23;--bg-card:#16213e;--bg-input:#0f1b30;
  --gold:#d4a340;--gold-light:#f0d78c;--accent:#7b68ee;--accent-light:#9b8bff;
  --text:#e8e0d4;--text-dim:#8b8299;--text-bright:#fff8ef;
  --success:#4ecdc4;--danger:#e85d4a;--border:#2a2a4a;
  --fitness:#e85d4a;--business:#d4a340;--mind:#7b68ee;--activation:#4ecdc4;
}
body.light-mode{
  --bg:#fafafa;--bg2:#f0ebe3;--bg-card:#ffffff;--bg-input:#f5f0e8;
  --gold:#8b6914;--gold-light:#b8860b;--accent:#5b4cd4;--accent-light:#6b5ce7;
  --text:#1a1a2e;--text-dim:#666666;--text-bright:#333333;
  --success:#2a7a73;--danger:#c0392b;--border:#e0e0e0;
  --fitness:#c0392b;--business:#8b6914;--mind:#5b4cd4;--activation:#2a7a73;
}
body.light-mode{background:linear-gradient(180deg,var(--bg),var(--bg2));}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;overflow-x:hidden;}
.app{max-width:640px;margin:0 auto;padding:0 12px 100px;position:relative;width:100%;box-sizing:border-box;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes scaleIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes glow-pulse{0%,100%{box-shadow:0 0 8px rgba(212,163,64,.3)}50%{box-shadow:0 0 25px rgba(212,163,64,.6)}}
@keyframes confetti-fall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(60px) rotate(360deg);opacity:0}}
@keyframes xp-float{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
@keyframes streak-fire{0%,100%{text-shadow:0 0 4px #ff6600}50%{text-shadow:0 0 12px #ff6600,0 0 20px #ff3300}}
.anim-fadein{animation:fadeIn .4s ease;}
.anim-slideup{animation:slideUp .4s ease;}
.anim-shake{animation:shake .4s ease;}
.anim-glow{animation:glow-pulse 2s infinite;}

/* Header */
.header{padding:28px 0 14px;text-align:center;animation:fadeIn .5s ease;}
.header-sub{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:3px;font-weight:700;}
.header-title{font-size:20px;font-weight:800;color:var(--text-bright);margin-top:2px;}
.header-xp{max-width:280px;margin:10px auto 0;}
.xp-text{font-size:11px;color:var(--text-dim);margin-top:3px;text-align:center;}

/* XP Bar */
.xpb{width:100%;border-radius:6px;overflow:hidden;position:relative;}
.xpb-bg{width:100%;height:100%;background:rgba(0,0,0,.4);border-radius:6px;}
.xpb-fill{height:100%;border-radius:6px;transition:width .8s cubic-bezier(.4,0,.2,1);position:relative;}
.xpb-fill::after{content:'';position:absolute;top:0;right:0;bottom:0;width:30px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2));border-radius:6px;}

/* Cards */
.card{background:var(--bg-card);border-radius:12px;padding:14px 18px;border:1px solid var(--border);margin-bottom:14px;animation:slideUp .4s ease;}

/* Stat Grid */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.stat-card{background:var(--bg-card);border-radius:12px;padding:12px 14px;transition:transform .2s ease,box-shadow .2s ease;}
.stat-card:hover{transform:translateY(-2px);}
.stat-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.stat-nm{font-size:12px;font-weight:600;}
.stat-lv{font-size:11px;color:var(--text-dim);}
.stat-streak{font-size:10px;margin-top:4px;display:flex;align-items:center;gap:4px;}

/* Period */
.period-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(212,163,64,.07);border-radius:10px;cursor:pointer;border:1px solid rgba(212,163,64,.1);margin-bottom:6px;transition:background .2s ease;}
.period-hdr:hover{background:rgba(212,163,64,.12);}
.period-left{display:flex;align-items:center;gap:8px;}
.period-lbl{color:var(--gold-light);font-weight:600;font-size:14px;}
.period-cnt{color:var(--text-dim);font-size:12px;}
.period-arr{color:var(--text-dim);font-size:16px;transition:transform .3s ease;}
.period-arr.open{transform:rotate(180deg);}
.period-quests{display:flex;flex-direction:column;gap:7px;padding-left:2px;margin-bottom:14px;}

/* Quest Item */
.qi{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;background:var(--bg-card);border-radius:10px;border:1px solid var(--border);transition:all .3s ease;animation:slideUp .3s ease;}
.qi.done{opacity:.6;}
.qi-check{width:26px;height:26px;border-radius:7px;border:2px solid var(--text-dim);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-top:2px;transition:all .25s ease;}
.qi-check:hover{transform:scale(1.15);}
.qi-check.done{border-color:transparent;}
.qi-body{flex:1;min-width:0;}
.qi-title{color:var(--text-bright);font-size:14px;font-weight:500;transition:all .3s ease;}
.qi-title.done{text-decoration:line-through;color:var(--text-dim);}
.qi-desc{color:var(--text-dim);font-size:11px;margin-top:2px;}
.qi-habit{margin-top:5px;padding:5px 9px;background:rgba(0,0,0,.3);border-radius:6px;font-size:10px;color:var(--text-dim);line-height:1.5;}
.qi-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.qi-xp{font-size:12px;font-weight:700;}
.qi-streak{font-size:10px;display:flex;align-items:center;gap:2px;}
.qi-edit{font-size:10px;color:var(--text-dim);cursor:pointer;padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.05);border:none;}
.qi-edit:hover{background:rgba(255,255,255,.1);}

/* XP Float */
.xp-float{position:fixed;pointer-events:none;z-index:999;font-weight:800;font-size:18px;animation:xp-float 1.2s ease forwards;}

/* Section Title */
.sec-title{color:var(--gold-light);font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}

/* Progress */
.prog-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.prog-lbl{color:var(--text-dim);font-size:12px;}
.prog-pct{font-weight:700;font-size:16px;}

/* Tabs (sub-navigation) */
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;}
.tab{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;background:rgba(255,255,255,.04);color:var(--text-dim);white-space:nowrap;transition:all .2s ease;}
.tab.active{background:rgba(212,163,64,.15);color:var(--gold-light);border-color:rgba(212,163,64,.3);}

/* Character */
.char-hero{background:linear-gradient(135deg,var(--bg-card),rgba(123,104,238,.1));border-radius:16px;padding:28px;text-align:center;border:1px solid rgba(123,104,238,.2);box-shadow:0 0 20px rgba(123,104,238,.12);margin-bottom:20px;}
.char-avatar{width:90px;height:90px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(135deg,rgba(212,163,64,.25),rgba(123,104,238,.25));border:3px solid rgba(212,163,64,.4);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 0 20px rgba(212,163,64,.25);transition:all .3s ease;}
.char-rank{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;font-weight:600;}
.char-lv{font-size:26px;font-weight:800;color:var(--text-bright);margin:4px 0;}
.char-total{color:var(--text-dim);font-size:12px;margin-bottom:14px;}
.char-stat{background:var(--bg-card);border-radius:12px;padding:14px 18px;margin-bottom:10px;}
.char-stat-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.char-stat-nm{font-size:15px;font-weight:600;}
.char-stat-lv{font-size:18px;font-weight:800;}
.char-stat-foot{display:flex;justify-content:space-between;margin-top:5px;font-size:10px;color:var(--text-dim);}
.char-stat-rank{font-size:10px;margin-top:3px;font-weight:600;}

/* Achievements */
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.ach-card{background:var(--bg-card);border-radius:10px;padding:12px;text-align:center;border:1px solid var(--border);transition:all .3s ease;}
.ach-card.unlocked{border-color:rgba(212,163,64,.4);box-shadow:0 0 12px rgba(212,163,64,.15);}
.ach-card.locked{opacity:.4;filter:grayscale(.8);}
.ach-icon{font-size:28px;margin-bottom:4px;}
.ach-name{font-size:11px;font-weight:600;color:var(--text-bright);}
.ach-desc{font-size:9px;color:var(--text-dim);margin-top:2px;}

/* Inventory */
.inv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.inv-slot{background:var(--bg-card);border-radius:10px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--border);font-size:28px;transition:all .3s ease;position:relative;}
.inv-slot.has-item{border-color:rgba(212,163,64,.3);box-shadow:0 0 8px rgba(212,163,64,.1);}
.inv-slot.empty{opacity:.3;}
.inv-name{font-size:8px;color:var(--text-dim);margin-top:2px;text-align:center;}

/* Skill Tree */
.skill-tree{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.skill-row{display:flex;align-items:center;gap:10px;}
.skill-node{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid var(--border);background:var(--bg-card);transition:all .3s ease;flex-shrink:0;}
.skill-node.unlocked{border-color:rgba(212,163,64,.5);box-shadow:0 0 10px rgba(212,163,64,.2);}
.skill-node.locked{opacity:.35;filter:grayscale(.7);}
.skill-info{flex:1;}
.skill-name{font-size:12px;font-weight:600;color:var(--text-bright);}
.skill-req{font-size:10px;color:var(--text-dim);}
.skill-line{width:2px;height:12px;background:var(--border);margin-left:21px;}

/* Boss Fight */
.boss-card{background:linear-gradient(135deg,var(--bg-card),rgba(232,93,74,.08));border-radius:14px;padding:18px;border:1px solid rgba(232,93,74,.25);margin-bottom:14px;}
.boss-hdr{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.boss-icon{font-size:36px;}
.boss-name{font-size:16px;font-weight:700;color:var(--danger);}
.boss-sub{font-size:11px;color:var(--text-dim);}
.boss-hp{margin-top:8px;}
.boss-reward{font-size:11px;color:var(--gold);margin-top:6px;}

/* Calendar / Heatmap */
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:14px;}
.hm-cell{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--text-dim);transition:all .2s ease;}
.hm-label{font-size:9px;color:var(--text-dim);text-align:center;font-weight:600;}
.hm-future{background:rgba(255,255,255,.02);}
.hm-empty{background:rgba(255,255,255,.04);}
.hm-low{background:rgba(78,205,196,.15);}
.hm-mid{background:rgba(78,205,196,.35);}
.hm-high{background:rgba(78,205,196,.55);}
.hm-full{background:rgba(78,205,196,.8);}

/* Random Event */
.event-banner{background:linear-gradient(135deg,rgba(212,163,64,.12),rgba(123,104,238,.12));border-radius:12px;padding:14px;border:1px solid rgba(212,163,64,.25);margin-bottom:14px;display:flex;align-items:center;gap:12px;cursor:pointer;animation:glow-pulse 3s infinite;}
.event-icon{font-size:28px;flex-shrink:0;}
.event-body{flex:1;}
.event-title{font-size:13px;font-weight:700;color:var(--gold-light);}
.event-desc{font-size:11px;color:var(--text-dim);margin-top:2px;}
.event-xp{font-size:12px;font-weight:700;color:var(--success);flex-shrink:0;}

/* Business Module */
.biz-stat{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.biz-stat:last-child{border-bottom:none;}
.biz-label{font-size:13px;color:var(--text);}
.biz-val{font-size:18px;font-weight:800;color:var(--business);}
.biz-input{width:60px;padding:6px 10px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;text-align:center;outline:none;}
.biz-input:focus{border-color:var(--gold);}
.biz-btn{padding:4px 12px;border-radius:6px;background:rgba(212,163,64,.15);border:1px solid rgba(212,163,64,.3);color:var(--gold);font-size:12px;font-weight:600;}

/* Editor */
.editor-title{color:var(--gold-light);font-size:18px;margin-bottom:18px;}
.fg{margin-bottom:14px;}
.fl{display:block;color:var(--text-dim);font-size:11px;font-weight:600;margin-bottom:3px;letter-spacing:.5px;text-transform:uppercase;}
.fi{width:100%;padding:9px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;}
.fi:focus{border-color:var(--gold);}
.fr{display:flex;gap:10px;flex-wrap:wrap;}
.fr>div{flex:1;min-width:120px;}
.fr .sm{flex:0 0 90px;min-width:90px;}
.habit-box{background:rgba(123,104,238,.07);border-radius:12px;padding:14px;border:1px solid rgba(123,104,238,.12);margin-bottom:14px;}
.habit-title{color:var(--accent-light);font-weight:600;font-size:13px;margin-bottom:10px;}
.habit-sub{font-size:10px;color:var(--text-dim);font-weight:400;}
.day-picker{display:flex;gap:5px;flex-wrap:wrap;}
.day-btn{padding:5px 10px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;border:1px solid transparent;background:rgba(0,0,0,.3);color:var(--text-dim);}
.day-btn.active{background:rgba(212,163,64,.18);color:var(--gold-light);border-color:rgba(212,163,64,.35);}
.btn-row{display:flex;gap:10px;margin-top:16px;}
.btn-save{flex:1;padding:11px 18px;background:linear-gradient(135deg,var(--gold),rgba(212,163,64,.8));border:none;border-radius:10px;color:#1a1a2e;font-weight:700;font-size:14px;box-shadow:0 0 15px rgba(212,163,64,.25);}
.btn-save:hover{filter:brightness(1.1);}
.btn-del{padding:11px 18px;background:rgba(232,93,74,.12);border:1px solid rgba(232,93,74,.25);border-radius:10px;color:var(--danger);font-weight:600;font-size:13px;}
.btn-cancel{padding:11px 18px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;color:var(--text-dim);font-weight:600;font-size:13px;}
.btn-new{padding:7px 14px;background:rgba(212,163,64,.12);border:1px solid rgba(212,163,64,.25);border-radius:8px;color:var(--gold);font-weight:600;font-size:12px;}
.btn-new:hover{background:rgba(212,163,64,.2);}

/* Manage */
.manage-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.manage-title{color:var(--gold-light);font-size:18px;}
.mi{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-card);border-radius:10px;border:1px solid var(--border);margin-bottom:7px;}
.mi.off{opacity:.45;}
.mi-tog{width:18px;height:18px;border-radius:4px;border:2px solid var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mi-info{flex:1;}
.mi-nm{color:var(--text-bright);font-size:13px;font-weight:500;}
.mi-meta{color:var(--text-dim);font-size:11px;}

/* Bottom Nav */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;background:rgba(22,33,62,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0 10px;z-index:800;}
.bnav-item{text-align:center;cursor:pointer;padding:3px 10px;color:var(--text-dim);transition:color .2s ease;border:none;background:none;}
.bnav-item.active{color:var(--gold);}
.bnav-icon{font-size:20px;}
.bnav-lbl{font-size:10px;font-weight:600;margin-top:1px;}

/* Weekly/Monthly Matrix */
.matrix-wrap{overflow-x:auto;margin-bottom:14px;-webkit-overflow-scrolling:touch;}
.matrix-table{border-collapse:collapse;width:100%;min-width:320px;}
.matrix-table th,.matrix-table td{padding:6px 4px;text-align:center;font-size:10px;border:1px solid var(--border);}
.matrix-table th{color:var(--text-dim);font-weight:600;background:rgba(0,0,0,.2);position:sticky;top:0;}
.matrix-table td.done{background:rgba(78,205,196,.2);color:var(--success);}
.matrix-table td.missed{background:rgba(232,93,74,.1);color:var(--danger);opacity:.5;}
.matrix-table td.na{background:transparent;color:var(--border);}
.matrix-table td.today-col{border-color:var(--gold)!important;}
.matrix-quest{text-align:left!important;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;font-weight:500;color:var(--text);}

/* Light mode matrix table overrides */
body.light-mode .matrix-table th{background:#f5f0e8;color:#333;}
body.light-mode .matrix-table td.done{background:rgba(42,122,115,.15)!important;color:#2a7a73;}
body.light-mode .matrix-table td.missed{background:rgba(192,57,43,.12)!important;color:#c0392b;opacity:1;}
body.light-mode .card{border-color:#e0e0e0;}
body.light-mode .qi{border-color:#e0e0e0;}

/* Badge System */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.badge-card{background:var(--bg-card);border-radius:12px;padding:14px 10px;text-align:center;border:1px solid var(--border);transition:all .3s ease;}
.badge-card.earned{border-color:rgba(212,163,64,.4);box-shadow:0 0 15px rgba(212,163,64,.12);animation:scaleIn .4s ease;}
.badge-card.locked{opacity:.3;filter:grayscale(.9);}
.badge-icon{font-size:32px;margin-bottom:4px;}
.badge-name{font-size:10px;font-weight:700;color:var(--gold-light);}
.badge-desc{font-size:8px;color:var(--text-dim);margin-top:2px;}
.badge-date{font-size:8px;color:var(--success);margin-top:3px;}

/* Rank Badge */
.rank-badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;}
.rank-D{background:rgba(139,130,153,.15);border:1px solid rgba(139,130,153,.3);color:#8b8299;}
.rank-C{background:rgba(78,205,196,.12);border:1px solid rgba(78,205,196,.25);color:#4ecdc4;}
.rank-B{background:rgba(123,104,238,.12);border:1px solid rgba(123,104,238,.25);color:#7b68ee;}
.rank-A{background:rgba(212,163,64,.12);border:1px solid rgba(212,163,64,.3);color:#d4a340;}
.rank-S{background:rgba(232,93,74,.12);border:1px solid rgba(232,93,74,.3);color:#e85d4a;}
.rank-SS{background:linear-gradient(135deg,rgba(232,93,74,.15),rgba(212,163,64,.15));border:1px solid rgba(255,100,0,.35);color:#ff6600;}
.rank-SSS{background:linear-gradient(135deg,rgba(255,100,0,.18),rgba(240,215,140,.18));border:1px solid rgba(240,215,140,.4);color:#f0d78c;text-shadow:0 0 8px rgba(240,215,140,.5);animation:glow-pulse 2s infinite;}

/* Emoji Picker */
.emoji-pick{display:flex;flex-wrap:wrap;gap:4px;max-height:120px;overflow-y:auto;padding:6px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;margin-top:4px;}
.emoji-opt{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border-radius:6px;border:2px solid transparent;transition:all .15s ease;}
.emoji-opt:hover{background:rgba(255,255,255,.08);}
.emoji-opt.selected{border-color:var(--gold);background:rgba(212,163,64,.1);}

/* Color Picker */
.color-pick{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.color-opt{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .15s ease;}
.color-opt:hover{transform:scale(1.2);}

function celebrate() {
  const cel = CELEBRATIONS[Math.floor(Math.random()*CELEBRATIONS.length)];
  const msg = cel.messages[Math.floor(Math.random()*cel.messages.length)];
  const host = document.getElementById('xp-float-host');

  // Show message
  const msgEl = document.createElement('div');
  msgEl.style.cssText = 'position:absolute;top:35%;left:50%;transform:translateX(-50%);font-size:16px;font-weight:800;color:var(--gold-light);text-shadow:0 0 15px rgba(212,163,64,.5);pointer-events:none;z-index:1003;';
  msgEl.style.animation = 'xp-float 1.5s ease forwards';
  msgEl.textContent = msg;
  host.appendChild(msgEl);
  setTimeout(()=>msgEl.remove(), 1600);

  if(cel.type === 'emoji_burst') {
    const emojis = cel.emojis;
    for(let i=0;i<5;i++){
      const el = document.createElement('div');
      el.className = 'celebrate-emoji';
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      el.style.left = (30+Math.random()*40)+'%';
      el.style.top = (35+Math.random()*20)+'%';
      el.style.animationDelay = (Math.random()*.3)+'s';
      el.style.fontSize = (24+Math.random()*16)+'px';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), 1800);
    }
  }
  else if(cel.type === 'confetti_mini') {
    const colors = ['#d4a340','#7b68ee','#4ecdc4','#e85d4a','#f0d78c'];
    for(let i=0;i<15;i++){
      const el = document.createElement('div');
      el.style.cssText = `position:fixed;width:${4+Math.random()*4}px;height:${4+Math.random()*4}px;background:${colors[i%colors.length]};border-radius:${Math.random()>.5?'50%':'1px'};left:${40+Math.random()*20}%;top:35%;z-index:1002;pointer-events:none;animation:confetti-fall ${.8+Math.random()*.8}s ease forwards;animation-delay:${Math.random()*.2}s;`;
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), 2000);
    }
  }
  else if(cel.type === 'flash') {
    const el = document.createElement('div');
    el.className = 'celebrate-flash';
    el.style.background = cel.color;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 700);
  }
  else if(cel.type === 'shake') {
    const app = document.getElementById('app');
    app.style.animation = 'celebrate-shake-big .5s ease';
    setTimeout(()=>app.style.animation='', 600);
  }
  else if(cel.type === 'emoji_rain') {
    for(let i=0;i<8;i++){
      const el = document.createElement('div');
      el.className = 'celebrate-emoji';
      el.textContent = cel.emojis[0];
      el.style.left = (20+Math.random()*60)+'%';
      el.style.top = (25+Math.random()*30)+'%';
      el.style.animationDelay = (Math.random()*.5)+'s';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), 2000);
    }
  }
  else if(cel.type === 'combo') {
    // Combo: flash + emojis + confetti mini
    const el = document.createElement('div');
    el.className = 'celebrate-flash';
    el.style.background = 'rgba(212,163,64,.1)';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 700);
    for(let i=0;i<4;i++){
      const em = document.createElement('div');
      em.className = 'celebrate-emoji';
      em.textContent = ['💥','⭐','🔥','💎'][i];
      em.style.left = (30+i*12)+'%';
      em.style.top = '38%';
      em.style.animationDelay = (i*.1)+'s';
      document.body.appendChild(em);
      setTimeout(()=>em.remove(), 1800);
    }
  }
}

// ── XP & Level ──
const XP_TABLE = Array.from({length:100},(_,i)=>Math.floor(100*Math.pow(1.15,i)));
const getLevel = xp => { let l=1,r=xp; for(let i=0;i<99;i++){if(r<XP_TABLE[i])break;r-=XP_TABLE[i];l++;}return l;};
const getXpIn = xp => { let r=xp; for(let i=0;i<99;i++){if(r<XP_TABLE[i])return r;r-=XP_TABLE[i];}return r;};
const getXpNext = xp => { let r=xp; for(let i=0;i<99;i++){if(r<XP_TABLE[i])return XP_TABLE[i];r-=XP_TABLE[i];}return XP_TABLE[98];};

function streakMultiplier(streak) { if(streak>=30) return 2.0; if(streak>=14) return 1.75; if(streak>=7) return 1.5; if(streak>=3) return 1.25; return 1.0; }
function streakLabel(m) { if(m>=2) return '2x'; if(m>=1.75) return '1.75x'; if(m>=1.5) return '1.5x'; if(m>=1.25) return '1.25x'; return '1x'; }

function getAvatarImage(lv) {

  let idx = 0;
  for(let i=0; i<AVATARS.length; i++) { if(lv>=AVATARS[i].min) idx=i; }
  if(S.avatarUrls && S.avatarUrls[idx]) return S.avatarUrls[idx];
  let img = AVATAR_IMAGES[0];
  for(const ai of AVATAR_IMAGES) { if(lv>=ai.min) img=ai; }
  return img.url;
}

}

function save() {
  try { localStorage.setItem('soulLevelingState', JSON.stringify(S)); } catch(e) {}
  // Debounce cloud sync (save to cloud max every 3 seconds)
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(syncToCloud, 3000);
}

function syncToCloud() {
  try {
    const payload = { id: SYNC_ID, state: JSON.parse(JSON.stringify(S)), updated_at: new Date().toISOString() };
    fetch(SUPA_URL + '/rest/v1/game_state', {
      method: 'POST',
      headers: {
        'apikey': SUPA_KEY,
        'Authorization': 'Bearer ' + SUPA_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify(payload)
    }).then(r => {
      if(r.ok) { S._lastCloudSync = new Date().toISOString(); }
    }).catch(()=>{});
  } catch(e) {}
}

function loadFromCloud(syncId) {
  return fetch(SUPA_URL + '/rest/v1/game_state?id=eq.' + syncId + '&select=state', {
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
  }).then(r => r.json()).then(rows => {
    if(rows && rows.length > 0 && rows[0].state) return rows[0].state;
    return null;
  }).catch(() => null);
}

// ── System Prompt Engine ──
function getSystemPrompt() {
  if (!S.systemDismissedToday) S.systemDismissedToday = [];
  // Check diagnostics first (highest priority)
  for (const msg of SYSTEM_MESSAGES.diagnostic) {
    if (!S.systemDismissedToday.includes(msg.id) && msg.condition(S)) return msg;
  }
  // Check soul philosophy (high priority — the deepest layer)
  for (const msg of SYSTEM_MESSAGES.soul) {
    if (!S.systemDismissedToday.includes(msg.id) && msg.condition(S)) return msg;
  }
  // Check motivational
  for (const msg of SYSTEM_MESSAGES.motivational) {
    if (!S.systemDismissedToday.includes(msg.id) && msg.condition(S)) return msg;
  }
  // Check wisdom (random)
  for (const msg of SYSTEM_MESSAGES.wisdom) {
    if (!S.systemDismissedToday.includes(msg.id) && msg.condition(S)) return msg;
  }
  return null;
}

function triggerSystemPrompt() {
  // Only show system prompt modals on special moments, not every quest
  S._questsCompletedSession = (S._questsCompletedSession||0) + 1;
  const tq = todayQuests();
  const allDone = tq.length>0 && tq.every(x=>S.completedToday[x.id]);
  const isStreak = Object.values(S.questStreaks||{}).some(v=>v===3||v===7||v===14||v===30);
  // Show on: perfect day, streak milestone, or every ~4th quest (with randomness)
  const shouldShow = allDone || isStreak || (S._questsCompletedSession % 4 === 0 && Math.random() < 0.5);
  if (!shouldShow) return;
  const msg = getSystemPrompt();
  if (msg) {
    S.systemPrompt = msg;
    S.showSystemModal = true;
    if (S.soundOn) AudioFX.play('event');
    render();
  }
}

function dismissSystem() {
  if (S.systemPrompt) {
    if (!S.systemDismissedToday) S.systemDismissedToday = [];
    S.systemDismissedToday.push(S.systemPrompt.id);
  }
  S.showSystemModal = false;
  S.systemPrompt = null;
  save(); render();
}

function systemAction(action) {
  if (action === 'showDiagnostics') { S.showDiagnostics = true; S.view = 'system'; dismissSystem(); }
  else if (action === 'showEasiest') { dismissSystem(); /* scroll to quests */ }
  else if (action === 'showTwoMin') { dismissSystem(); }
}

// ── Habit Diagnostics Engine (James Clear 4 Laws Analysis) ──
function diagnoseHabit(quest) {
  const issues = [];
  const streak = S.questStreaks[quest.id] || 0;
  const best = S.questBestStreaks[quest.id] || 0;
  const h = quest.habit || {};

  // Law 1: Make it Obvious — check if cue is defined
  if (!h.time || !h.place || !h.trigger) {
    issues.push({
      law: "Law 1 · Make it Obvious",
      status: "red",
      problem: "Manglende cue-definition. Tid, sted eller trigger er ikke sat.",
      fix: `Definer en Implementation Intention: "Jeg vil ${quest.title} kl. [TID] på [STED]." Tilføj en visuel trigger der gør cue'et umuligt at overse.`,
      jc: "1.2 Implementation Intention + 1.4 Design Your Environment"
    });
  } else {
    issues.push({law:"Law 1 · Make it Obvious",status:"green",problem:"Cue er defineret: "+h.time+" · "+h.place+" · "+h.trigger,fix:"",jc:""});
  }

  // Law 2: Make it Attractive — check if reward/bundling exists
  if (!h.reward) {
    issues.push({
      law: "Law 2 · Make it Attractive",
      status: "yellow",
      problem: "Ingen belønning defineret. Vanen mangler et attraktivt element.",
      fix: `Tilføj en Temptation Bundle: "Mens/efter jeg ${quest.title}, får jeg [noget jeg nyder]." F.eks. yndlings-musik, kaffe, social tid.`,
      jc: "2.1 Temptation Bundling + 2.3 Motivation Ritual"
    });
  } else {
    issues.push({law:"Law 2 · Make it Attractive",status:"green",problem:"Belønning sat: "+h.reward,fix:"",jc:""});
  }

  // Law 3: Make it Easy — check 2-min rule
  if (!h.twoMin) {
    issues.push({
      law: "Law 3 · Make it Easy",
      status: "red",
      problem: "Ingen 2-minutters version defineret. Vanen er for stor til at starte let.",
      fix: `Definer en 2-min version: Hvad er den MINDSTE ting du kan gøre? "Tag skoene på." "Åbn dokumentet." "Sæt dig på måtten." Start derfra.`,
      jc: "3.4 The Two-Minute Rule"
    });
  } else {
    issues.push({law:"Law 3 · Make it Easy",status:"green",problem:"2-min version: "+h.twoMin,fix:"",jc:""});
  }

  // Law 4: Make it Satisfying — check streak & tracking
  if (streak === 0 && best > 3) {
    issues.push({
      law: "Law 4 · Make it Satisfying",
      status: "red",
      problem: `Broken streak! Best var ${best} dage, men nu er den nulstillet. NEVER MISS TWICE.`,
      fix: "Show up i dag, selv om det bare er 2-min versionen. En dårlig rep tæller mere end ingen rep. Din streak er din belønning — genstart den NU.",
      jc: "4.3 Habit Tracker + 4.4 Never Miss Twice"
    });
  } else if (streak > 0) {
    issues.push({law:"Law 4 · Make it Satisfying",status:"green",problem:`Streak aktiv: ${streak} dage (best: ${best})`,fix:"",jc:""});
  } else {
    issues.push({
      law: "Law 4 · Make it Satisfying",
      status: "yellow",
      problem: "Ingen streak endnu. Tracking er ikke i gang.",
      fix: "Start i dag. Gennemfør quest'en og se streaken begynde. 'Don't break the chain.'",
      jc: "4.3 Habit Tracker"
    });
  }

  // Bonus: Environment check
  if (streak > 0 && streak < 3) {
    issues.push({
      law: "Bonus · Environment Design",
      status: "yellow",
      problem: "Vanen er ny (under 3 dage). Kritisk fase — de første dage er de sværeste.",
      fix: "Prime dit miljø i AFTEN: Læg ting klar, fjern distraktioner, sæt alarmer. Gør det umuligt at glemme og nemt at starte.",
      jc: "3.2 Prime Your Environment + 1.4 Design Your Environment"
    });
  }

  return issues;
}

function getAllDiagnostics() {
  return S.quests.filter(q => q.active).map(q => ({
    quest: q,
    issues: diagnoseHabit(q),
    overallStatus: diagnoseHabit(q).some(i=>i.status==='red') ? 'red' : diagnoseHabit(q).some(i=>i.status==='yellow') ? 'yellow' : 'green'
  }));
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function getCat(id){return CATS.find(c=>c.id===id)||CATS[0];}
function todayQuests(){return S.quests.filter(q=>q.days.includes(today)&&q.active);}

function xpBar(cur,max,color='#d4a340',h=12){
  const p=Math.min((cur/Math.max(max,1))*100,100);
  return `<div class="xpb" style="height:${h}px;border:1px solid ${color}33"><div class="xpb-bg"><div class="xpb-fill" style="width:${p}%;background:linear-gradient(90deg,${color}88,${color});box-shadow:0 0 8px ${color}55"></div></div></div>`;
}

// Direct DOM notification system (bypasses render cycle)
function notify(text,type='xp') {
  let wrap=document.getElementById('notif-host');
  if(!wrap){
    wrap=document.createElement('div');
    wrap.id='notif-host';
    wrap.className='notif-wrap';
    document.body.appendChild(wrap);
  }
  const icons={levelup:'🏆 ',boss:'🐉 ',loot:'🎁 ',event:'🌟 ',xp:'⚡ '};
  const el=document.createElement('div');
  el.className=`notif ${type}`;
  el.textContent=(icons[type]||'⚡ ')+text;
  el.style.animation='fadeIn .3s ease';
  wrap.appendChild(el);
  // Keep max 3
  while(wrap.children.length>3) wrap.removeChild(wrap.firstChild);
  // Auto-remove after 2.5s
  setTimeout(()=>{
    el.style.animation='fadeOut .4s ease forwards';
    setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},400);
  },2500);
}

function checkAchievements() {
  ACHIEVEMENTS.forEach(a => {
    if (!S.achievements.includes(a.id) && a.check(S)) {
      S.achievements.push(a.id);
      notify(`🏅 Achievement Unlocked: ${a.name}!`, 'loot');
      AudioFX.play('loot');
      maybeDropLoot();
    }
  });
  checkBadges();
}

function checkBadges() {
  if(!S.badges) S.badges=[];
  BADGES.forEach(b => {
    if(!S.badges.find(x=>x.id===b.id) && b.check(S)) {
      S.badges.push({id:b.id,date:todayStr});
      notify(`🎖️ Badge: ${b.icon} ${b.name}!`, 'loot');
    }
  });
}

function maybeDropLoot() {
  if (Math.random() < 0.35) {
    const available = LOOT_POOL.filter(l => !S.inventory.find(i => i.id === l.id));
    if (available.length > 0) {
      const item = available[Math.floor(Math.random()*available.length)];
      S.inventory.push({...item});
      notify(`\uD83C\uDF81 Loot Drop: ${item.icon} ${item.name}!`, 'loot');
      AudioFX.play('loot');
    }
  }
}

function checkBossProgress() {
  if (!S.currentBoss) return;
  const b = S.currentBoss;
  let prog = 0;
  if (b.type === 'perfect_days') prog = S.perfectDays;
  else if (b.type === 'business_convos') prog = S.businessStats.conversations;
  else if (b.type === 'fitness_days') prog = Object.values(S.questStreaks).filter((_,i)=>S.quests[i]?.category==='fitness').reduce((a,b)=>Math.max(a,b),0);
  else if (b.type === 'mind_streak') prog = Object.entries(S.questStreaks).filter(([k])=>{const q=S.quests.find(x=>x.id==+k);return q?.category==='mind';}).reduce((a,[_,v])=>Math.max(a,v),0);
  else if (b.type === 'activation_count') prog = S.categoryXp.activation > 0 ? Math.floor(S.categoryXp.activation / 35) : 0;
  S.bossProgress = Math.min(prog, b.target);
  if (S.bossProgress >= b.target) {
    S.bossesDefeated = (S.bossesDefeated||0) + 1;
    S.totalXp += b.reward;
    const lootItem = LOOT_POOL.find(l => l.id === b.loot);
    if (lootItem && !S.inventory.find(i=>i.id===lootItem.id)) S.inventory.push({...lootItem});
    notify(`\uD83D\uDC09 BOSS DEFEATED: ${b.name}! +${b.reward} XP`, 'boss');
    AudioFX.play('boss');
    spawnConfetti();
    // New boss next render
    const tmpl = BOSS_TEMPLATES[Math.floor(Math.random()*BOSS_TEMPLATES.length)];
    S.currentBoss = {...tmpl};
    S.bossProgress = 0;
  }
}

// ═══ ACTIONS ═══
function completeQuest(id) {
  const q = S.quests.find(x=>x.id===id);
  if (!q) return;
  if (S.completedToday[id]) {
    // Undo — restore streak to what it was before today's completion
    const prevStreak = S._streakBeforeComplete && S._streakBeforeComplete[id] != null
      ? S._streakBeforeComplete[id] : Math.max(0, (S.questStreaks[id]||0) - 1);
    const mult = streakMultiplier(S.questStreaks[id]||0);
    const earned = Math.floor(q.xp * mult);
    delete S.completedToday[id];
    S.totalXp = Math.max(0, S.totalXp - earned);
    S.categoryXp[q.category] = Math.max(0, S.categoryXp[q.category] - earned);
    S.questStreaks[id] = prevStreak;
    // Remove from completedDates
    if(S.completedDates[todayStr]) S.completedDates[todayStr] = S.completedDates[todayStr].filter(x=>x!==id);
    if(S.soundOn) AudioFX.play('undo');
  } else {
    // Complete — save streak before incrementing so undo can restore it
    if(!S._streakBeforeComplete) S._streakBeforeComplete = {};
    S._streakBeforeComplete[id] = S.questStreaks[id]||0;
    S.questStreaks[id] = (S.questStreaks[id]||0) + 1;
    S.questBestStreaks[id] = Math.max(S.questBestStreaks[id]||0, S.questStreaks[id]);
    const mult = streakMultiplier(S.questStreaks[id]);
    const earned = Math.floor(q.xp * mult);
    const oldLv = getLevel(S.totalXp);
    S.totalXp += earned;
    S.categoryXp[q.category] += earned;
    S.completedToday[id] = true;
    // Track date
    if(!S.completedDates[todayStr]) S.completedDates[todayStr] = [];
    if(!S.completedDates[todayStr].includes(id)) S.completedDates[todayStr].push(id);

    const multLabel = mult > 1 ? ` (${streakLabel(mult)} streak!)` : '';
    notify(`\u26A1 +${earned} XP \u2014 ${q.title}${multLabel}`, 'xp');
    if (S.soundOn) AudioFX.play('complete');
    showXpFloat(earned);
    celebrate();

    const newLv = getLevel(S.totalXp);
    if (newLv > oldLv) {
      S.showLevelUp = true;
      S.levelUpValue = newLv;
      notify(`🏆 LEVEL UP! Du er nu Level ${newLv}!`, 'levelup');
      if (S.soundOn) setTimeout(()=>AudioFX.play('levelup'), 300);
      spawnConfetti();
      maybeDropLoot();
      // Check rank up
      const oldRank=getRank(oldLv), newRank=getRank(newLv);
      if(newRank.id!==oldRank.id) {
        setTimeout(()=>showRankUpCeremony(oldRank,newRank), 800);
      }
    }

    // Check all daily complete
    const tq = todayQuests();
    if (tq.length > 0 && tq.every(x => S.completedToday[x.id])) {
      S.perfectDays = (S.perfectDays||0) + 1;
      const bonus = Math.floor(tq.length * 10);
      S.totalXp += bonus;
      notify(`\uD83C\uDF1F PERFECT DAY! +${bonus} bonus XP`, 'levelup');
      if (S.soundOn) setTimeout(()=>AudioFX.play('allclear'), 500);
      spawnConfetti();
    }

    checkAchievements();
    checkBossProgress();
    // Trigger system prompts after quest completion
    setTimeout(triggerSystemPrompt, 800);
  }
  save(); render();
}

function togglePastCompletion(qId, dateStr) {

    notify('Fjernet fra '+dateStr,'xp');
  } else {

    notify('\u2713 Rettet for '+dateStr,'xp');

let _monthModalQuestId=null;
function openMonthHabitModal(qId) {
  _monthModalQuestId=qId;
  const q=S.quests.find(x=>x.id===qId);
  if(!q) return;
  const now=new Date();
  const year=now.getFullYear(), month=now.getMonth();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const _mn=['Jan','Feb','Mar','Apr','Maj','Jun','Jul','Aug','Sep','Okt','Nov','Dec'];
  const _dn=['Søn','Man','Tir','Ons','Tor','Fre','Lør'];
  const todayD=now.getDate();

  let html='';
  html+='<div class="modal-overlay" onclick="closeMonthHabitModal()" style="z-index:1100">';
  html+='<div onclick="event.stopPropagation()" style="background:linear-gradient(135deg,var(--bg-card),var(--bg));border-radius:18px;padding:20px;border:2px solid rgba(212,163,64,.35);max-width:360px;width:92%;max-height:85vh;overflow-y:auto">';

  // Header
  const cat=getCat(q.category);
  const emoji=q.emoji||cat.icon;
  html+='<div style="text-align:center;margin-bottom:14px">';
  html+='<div style="font-size:28px">'+emoji+'</div>';
  html+='<div style="font-size:15px;font-weight:800;color:var(--gold-light)">'+q.title+'</div>';
  html+='<div style="font-size:11px;color:var(--text-dim)">'+_mn[month]+' '+year+' — tryk for at rette</div>';
  html+='</div>';

  // Day-of-week headers
  html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px">';
  ['Man','Tir','Ons','Tor','Fre','Lør','Søn'].forEach(function(d){
    html+='<div style="text-align:center;font-size:9px;font-weight:700;color:var(--text-dim);padding:2px 0">'+d+'</div>';
  });
  html+='</div>';

  // Calendar grid — start on correct weekday (Mon=0)
  html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">';
  var firstDay=new Date(year,month,1).getDay();
  var startOffset=(firstDay===0?6:firstDay-1); // Mon-based offset
  for(var e=0;e<startOffset;e++){
    html+='<div></div>';
  }

  for(var day=1;day<=daysInMonth;day++){
    var d=new Date(year,month,day);
    var ds=d.toISOString().slice(0,10);
    var isToday=(day===todayD);
    var scheduled=q.days.includes(d.getDay());
    var isPast=d<new Date(year,month,todayD);
    var isFuture=day>todayD;
    var wasDone=false;
    if(isToday){ wasDone=!!S.completedToday[q.id]; }
    else { wasDone=(S.completedDates[ds]||[]).includes(q.id); }

    if(!scheduled){
      // Not scheduled — dim dot
      html+='<div style="text-align:center;padding:8px 2px;font-size:10px;color:var(--text-dim);opacity:.3;border-radius:8px">'+day+'</div>';
    } else if(isFuture){
      // Future — neutral
      html+='<div style="text-align:center;padding:8px 2px;font-size:12px;color:var(--text-dim);border-radius:8px;border:1px solid rgba(255,255,255,.05)">'+day+'</div>';
    } else {
      // Past or today — tappable
      var bg=wasDone?'rgba(78,205,196,.18)':'rgba(232,93,74,.1)';
      var border=wasDone?'rgba(78,205,196,.5)':'rgba(232,93,74,.3)';
      var color=wasDone?'var(--success)':'var(--danger)';
      var icon=wasDone?'✓':'✗';
      var clickFn=isToday?'completeQuest('+q.id+')':'togglePastCompletion('+q.id+',\''+ds+'\')';
      html+='<div onclick="'+clickFn+'" style="text-align:center;padding:6px 2px;border-radius:8px;cursor:pointer;background:'+bg+';border:1.5px solid '+border+';transition:all .15s';
      if(isToday) html+=';box-shadow:0 0 8px rgba(212,163,64,.3)';
      html+='">';
      html+='<div style="font-size:13px;font-weight:700;color:'+color+'">'+icon+'</div>';
      html+='<div style="font-size:10px;color:'+(isToday?'var(--gold)':'var(--text-dim)')+'">'+day+'</div>';
      html+='</div>';
    }
  }
  html+='</div>';

  // Stats summary
  var totalScheduled=0, totalDone=0;
  for(var day2=1;day2<=Math.min(todayD,daysInMonth);day2++){
    var d2=new Date(year,month,day2);
    if(!q.days.includes(d2.getDay())) continue;
    totalScheduled++;
    var ds2=d2.toISOString().slice(0,10);
    if(day2===todayD){ if(S.completedToday[q.id]) totalDone++; }
    else { if((S.completedDates[ds2]||[]).includes(q.id)) totalDone++; }
  }
  var pct=totalScheduled?Math.round(totalDone/totalScheduled*100):0;
  html+='<div style="text-align:center;margin-top:14px;padding:10px;background:rgba(212,163,64,.06);border-radius:10px">';
  html+='<span style="font-size:20px;font-weight:800;color:'+(pct>=80?'var(--success)':pct>=50?'var(--gold-light)':'var(--danger)')+'">'+pct+'%</span>';
  html+='<span style="font-size:11px;color:var(--text-dim);margin-left:8px">'+totalDone+'/'+totalScheduled+' dage denne måned</span>';
  html+='</div>';

  // Close button
  html+='<button onclick="closeMonthHabitModal()" style="width:100%;margin-top:12px;padding:10px;background:rgba(212,163,64,.1);border:1px solid rgba(212,163,64,.2);border-radius:10px;color:var(--gold-light);font-weight:700;font-size:13px;cursor:pointer">Luk</button>';
  html+='</div></div>';

  // Inject without full re-render
  var existing=document.getElementById('month-habit-modal');
  if(existing) { existing.innerHTML=html; }
  else {
    var div=document.createElement('div');
    div.id='month-habit-modal';
    div.innerHTML=html;
    document.body.appendChild(div);
  }
}

    S.monthlyGoals=S.monthlyGoals.filter(function(g){return g!==''}).map(function(g){return {text:g,progress:0}});
  }
  if(S.weeklyGoals && S.weeklyGoals.length>0 && typeof S.weeklyGoals[0]==='string'){
    S.weeklyGoals=S.weeklyGoals.filter(function(g){return g!==''}).map(function(g){return {text:g,progress:0}});

  if(!S.weeklyGoals) S.weeklyGoals=[];

  h+='</div>';

}
function deleteQuest(id) { S.quests=S.quests.filter(q=>q.id!==id); S.view="quests"; save(); render(); }
function dismissLevelUp() { S.showLevelUp=false; render(); }
function toggleSound() { S.soundOn=!S.soundOn; save(); render(); }
function updateBizStat(key,delta) { S.businessStats[key] = Math.max(0, (S.businessStats[key]||0)+delta); if(delta>0){S.totalXp+=15;S.categoryXp.business+=15;notify(`+15 XP — ${key}`,'xp');if(S.soundOn)AudioFX.play('complete');showXpFloat(15);} checkBossProgress(); save(); render(); }

function saveQuest(data) {
  const idx=S.quests.findIndex(q=>q.id===data.id);
  if(idx>=0) S.quests[idx]=data;
  else S.quests.push({...data,id:Date.now()});
  S.view=S._editReturnTo||"quests"; S._editReturnTo=null; S.editingQuest=null; save(); render();
}

function toggleEditDay(d) {
  const q=window.__eq;
  const i=q.days.indexOf(d);
  if(i>=0) q.days.splice(i,1); else q.days.push(d);
  S.editingQuest=q; render();
}

function saveEditedQuest() {
  const q=window.__eq;
  q.title=document.getElementById('eq_t').value;
  q.description=document.getElementById('eq_d').value;
  q.period=document.getElementById('eq_p').value;
  q.category=document.getElementById('eq_c').value;
  q.xp=parseInt(document.getElementById('eq_x').value)||30;
  q.habit.time=document.getElementById('eq_ht').value;
  q.habit.place=document.getElementById('eq_hp').value;
  q.habit.trigger=document.getElementById('eq_htr').value;
  q.habit.twoMin=document.getElementById('eq_h2').value;
  q.habit.reward=document.getElementById('eq_hr').value;
  q.habit.why=document.getElementById('eq_hwhy').value;
  // Reminder
  const remTime=document.getElementById('eq_reminder');
  if(remTime&&remTime.value) {
    if(!S.reminders) S.reminders={};
    S.reminders[q.id]=remTime.value;
  }
  q.active=true;
  saveQuest(q);
}

function renderPeriod(label,icon,period) {
  const qs=S.quests.filter(q=>q.period===period&&q.days.includes(today)&&q.active);
  if(!qs.length) return '';
  const dn=qs.filter(q=>S.completedToday[q.id]).length;
  const isOpen=__periods[period];
  let h=`<div style="margin-bottom:12px">
    <div class="period-hdr" onclick="__periods['${period}']=!__periods['${period}'];S.periodsOpen=__periods;save();render()">
      <div class="period-left"><span style="font-size:16px">${icon}</span><span class="period-lbl">${label}</span><span class="period-cnt">(${dn}/${qs.length})</span></div>
      <span class="period-arr ${isOpen?'open':''}">&#x25BE;</span></div>`;
  if(isOpen){
    h+=`<div class="period-quests">`;
    qs.forEach(q=>{
      const cat=getCat(q.category), isDone=!!S.completedToday[q.id];
      const qColor=q.color||cat.color;
      const qEmoji=q.emoji||cat.icon;
      const streak=S.questStreaks[q.id]||0;
      const mult=streakMultiplier(streak);
      const earnXp=Math.floor(q.xp*mult);
      h+=`<div class="qi ${isDone?'done':''}" style="border-color:${isDone?qColor+'44':'var(--border)'}${isDone?';background:'+qColor+'0d':''};border-left:3px solid ${qColor}">
        <div class="qi-check ${isDone?'done':''}" style="${isDone?'background:'+qColor+';border-color:'+qColor:''}" onclick="completeQuest(${q.id})">
          ${isDone?'<span style="color:#fff;font-size:14px;font-weight:bold">✓</span>':''}</div>
        <div class="qi-body">
          <div class="qi-title ${isDone?'done':''}">${qEmoji} ${q.title}</div>
          <div class="qi-desc">${q.description}</div>
          ${q.habit&&!isDone?`<div class="qi-habit" style="padding:8px 10px">
            <div style="display:flex;gap:12px;margin-bottom:5px;flex-wrap:wrap">
              <span>\u23F0 ${q.habit.time}</span><span>\uD83D\uDCCD ${q.habit.place}</span>
            </div>
            ${q.habit.trigger?`<div style="margin:5px 0;padding:6px 8px;background:rgba(255,165,0,.1);border:1px solid rgba(255,165,0,.2);border-radius:6px;display:flex;align-items:center;gap:6px">
              <span style="font-size:14px">\uD83D\uDC41\uFE0F</span>
              <div><span style="font-size:9px;color:#ffa500;text-transform:uppercase;letter-spacing:1px;font-weight:700">Visuelt Cue</span><br>
              <span style="color:var(--text);font-size:12px">${q.habit.trigger}</span></div>
            </div>`:''}
            <div style="margin-top:5px;padding:6px 8px;background:rgba(0,200,255,.08);border:1px solid rgba(0,200,255,.15);border-radius:6px;display:flex;align-items:center;gap:6px">
              <span style="font-size:14px">\u2705</span>
              <div><span style="font-size:9px;color:#00c8ff;text-transform:uppercase;letter-spacing:1px;font-weight:700">Success Criteria (2 min)</span><br>
              <span style="color:var(--text-bright);font-size:12px;font-weight:600">${q.habit.twoMin}</span></div>
            </div>
            ${q.habit.reward?`<div style="margin-top:5px;padding:6px 8px;background:rgba(212,163,64,.08);border:1px solid rgba(212,163,64,.15);border-radius:6px;display:flex;align-items:center;gap:6px">
              <span style="font-size:14px">\uD83C\uDF81</span>
              <div><span style="font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;font-weight:700">Belønning</span><br>
              <span style="color:var(--text);font-size:12px">${q.habit.reward}</span></div>
            </div>`:''}
            ${q.habit.why?`<div style="margin-top:5px;padding:6px 8px;background:rgba(123,104,238,.08);border:1px solid rgba(123,104,238,.15);border-radius:6px;display:flex;align-items:center;gap:6px">
              <span style="font-size:14px">\uD83D\uDD2E</span>
              <div><span style="font-size:9px;color:var(--accent-light);text-transform:uppercase;letter-spacing:1px;font-weight:700">Why · Identitet</span><br>
              <span style="color:var(--text-bright);font-size:12px;font-style:italic">"${q.habit.why}"</span></div>
            </div>`:''}
          </div>`:''}
          ${isDone&&q.habit?`<div class="qi-habit" style="padding:6px 10px">
            ${q.habit.reward?`<span style="color:var(--gold)">\uD83C\uDF81 ${q.habit.reward}</span>`:``}
            ${q.habit.why?`<div style="margin-top:${q.habit.reward?'4px':'0'};color:var(--accent-light);font-style:italic">\uD83D\uDD2E "${q.habit.why}"</div>`:''}
          </div>`:''}
        </div>
        <div class="qi-right">
          <span class="qi-xp" style="color:${cat.color}">+${earnXp} XP</span>
          ${streak>0?`<span class="qi-streak" style="color:${streak>=7?'#ff6600':'var(--text-dim)'}${streak>=7?';animation:streak-fire 1.5s infinite':''}">\uD83D\uDD25 ${streak}d ${mult>1?streakLabel(mult):''}</span>`:''}
          <button class="qi-edit" onclick="event.stopPropagation();editQuest(S.quests.find(x=>x.id===${q.id}))">Rediger</button>
        </div></div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  return h;
}

function renderSkillTrees() {
  let h='';
  CATS.forEach(cat=>{
    const clv=getLevel(S.categoryXp[cat.id]||0);
    const tree=SKILL_TREES[cat.id]||[];
    h+=`<div class="sec-title" style="margin-top:14px">${cat.icon} ${cat.name} Skills</div>`;
    h+=`<div class="skill-tree">`;
    tree.forEach((sk,i)=>{
      const unlocked=clv>=sk.req;
      if(i>0) h+=`<div class="skill-line" style="background:${unlocked?cat.color+'66':'var(--border)'}"></div>`;
      h+=`<div class="skill-row"><div class="skill-node ${unlocked?'unlocked':'locked'}" style="${unlocked?'border-color:'+cat.color+'88;box-shadow:0 0 10px '+cat.color+'33':''}">${sk.icon}</div>
        <div class="skill-info"><div class="skill-name" style="${unlocked?'color:'+cat.color:''}">${sk.name}</div>
        <div class="skill-req">${unlocked?'\u2713 Unlocked':'Kræver Lv.'+sk.req+' '+cat.name} · ${sk.desc}</div></div></div>`;
    });
    h+=`</div>`;
  });
  return h;
}

function renderInventory() {
  let h=`<div class="sec-title">Inventory (${S.inventory.length} items)</div><div class="inv-grid">`;
  for(let i=0;i<12;i++){
    const item=S.inventory[i];

      const rarityColor=item.rarity==='legendary'?'#d4a340':item.rarity==='epic'?'#7b68ee':item.rarity==='rare'?'#4ecdc4':'var(--text-dim)';
      h+=`<div class="inv-slot has-item" style="border-color:${rarityColor}55" title="${item.name}: ${item.desc}">
        ${item.icon}<div class="inv-name" style="color:${rarityColor}">${item.name.split(' ').slice(-1)}</div></div>`;
    } else {
      h+=`<div class="inv-slot empty">·</div>`;

  h+=`</div>`;
  // Rarity legend
  h+=`<div style="display:flex;gap:12px;justify-content:center;margin-top:6px">

// Pipeline helpers
function addPipelineEntry(){
  const name=document.getElementById('pipe_name').value.trim();
  if(!name) return;
  if(!S.pipeline) S.pipeline=[];
  S.pipeline.push({id:Date.now(),name,stage:'signal',energy:'warm',nextStep:'',notes:'',created:todayStr});
  save(); notify('\u2728 Ny pipeline entry!','xp'); render();
}
function movePipelineStage(id,newStage){
  const p=S.pipeline.find(x=>x.id===id);
  if(p){
    p.stage=newStage;
    if(newStage==='landed'){ notify('\uD83C\uDFC6 Landed i 3D! '+p.name,'levelup'); if(S.soundOn) AudioFX.play('allclear'); spawnConfetti(); }
    else { notify('\u2192 '+p.name+' moved to '+newStage,'xp'); if(S.soundOn) AudioFX.play('complete'); }
  }
  save(); render();
}
function editPipelineEntry(id){
  const p=S.pipeline.find(x=>x.id===id);
  if(!p) return;
  const name=prompt('Navn:',p.name); if(name) p.name=name;
  const next=prompt('N\u00E6ste step:',p.nextStep||''); if(next!==null) p.nextStep=next;
  const energy=prompt('Energi (hot/warm/cold):',p.energy||'warm'); if(energy) p.energy=energy;
  save(); render();
}

function startSessionTimer() {
  if(window._lsTimer) clearInterval(window._lsTimer);
  window._lsTimer=setInterval(()=>{
    const el=document.getElementById('session-timer');
    if(!el){clearInterval(window._lsTimer);window._lsTimer=null;return;}
    const s=S.leadershipSession;if(!s||!s.active){clearInterval(window._lsTimer);window._lsTimer=null;return;}
    const e=Math.floor((Date.now()-s.startTime)/1000);
    el.textContent=String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0');
  },1000);
}

function startLeadershipSession() {
  const focus=document.getElementById('ls_focus').value.trim();
  if(!focus) { notify('Skriv hvad du vil fokusere p\u00E5!','event'); return; }
  const sacral=document.getElementById('ls_sacral_val').value;
  const stateReg=document.getElementById('ls_state').value;

  S.leadershipSession={
    active: true,
    focus: focus,
    sacralResponse: sacral,
    stateReg: stateReg,
    startTime: Date.now(),
    date: todayStr
  };
  save();
  if(S.soundOn) AudioFX.play('complete');
  notify('\u2694\uFE0F Leadership Session startet!','boss');
  render();
}

function endLeadershipSession() {
  if(!S.leadershipSession || !S.leadershipSession.active) return;
  const session=S.leadershipSession;
  const duration=Math.floor((Date.now()-session.startTime)/1000);

  const whatLanded=prompt('Hvad landede i 3D? (hvad blev f\u00E6rdigt/skabt)','');
  const nextBreadcrumb=prompt('N\u00E6ste breadcrumb? (hvad er det n\u00E6ste lille skridt)','');

  if(!S.leadershipLog) S.leadershipLog=[];
  S.leadershipLog.push({
    focus: session.focus,
    sacralResponse: session.sacralResponse,
    stateReg: session.stateReg,
    date: session.date,
    duration: duration,
    whatLanded: whatLanded||'',
    nextBreadcrumb: nextBreadcrumb||'',
    landed: !!whatLanded
  });

  S.leadershipSession=null;
  save();

  if(whatLanded) {
    spawnConfetti();
    if(S.soundOn) AudioFX.play('allclear');
    notify('\uD83C\uDFC6 Session afsluttet \u2014 landed i 3D!','levelup');
    const xpGain=40;
    S.totalXp+=xpGain;
    S.categoryXp.business=(S.categoryXp.business||0)+xpGain;
  } else {
    if(S.soundOn) AudioFX.play('complete');
    notify('\u2713 Session afsluttet','xp');
  }
  render();
}

function renderHabitReport() {
  const now=new Date();
  let h=`<div class="sec-title">📈 Habit Rapport</div>`;

  // Overall stats
  let total7=0,done7=0,total30=0,done30=0;
  for(let i=0;i<30;i++){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    const doneList=S.completedDates[ds]||[];
    const possible=S.quests.filter(q=>q.days.includes(d.getDay())&&q.active).length;
    if(i<7){total7+=possible;done7+=doneList.length;}
    total30+=possible;done30+=doneList.length;
  }
  const pct7=total7?Math.round(done7/total7*100):0;
  const pct30=total30?Math.round(done30/total30*100):0;

  h+=`<div class="card">
    <div style="display:flex;justify-content:space-around;text-align:center">
      <div><div style="font-size:28px;font-weight:800;color:${pct7>=80?'var(--success)':pct7>=50?'var(--gold)':'var(--danger)'}">${pct7}%</div><div style="font-size:10px;color:var(--text-dim)">Sidste 7 dage</div></div>
      <div><div style="font-size:28px;font-weight:800;color:${pct30>=80?'var(--success)':pct30>=50?'var(--gold)':'var(--danger)'}">${pct30}%</div><div style="font-size:10px;color:var(--text-dim)">Sidste 30 dage</div></div>
    </div></div>`;

  // Best and worst quests
  const questStats=S.quests.filter(q=>q.active).map(q=>{
    let done=0,possible=0;
    for(let i=0;i<30;i++){
      const d=new Date(now);d.setDate(d.getDate()-i);
      if(!q.days.includes(d.getDay())) continue;
      possible++;
      const ds=d.toISOString().slice(0,10);
      if((S.completedDates[ds]||[]).includes(q.id)) done++;
    }
    return {quest:q,done,possible,pct:possible?Math.round(done/possible*100):0,streak:S.questStreaks[q.id]||0};
  }).sort((a,b)=>b.pct-a.pct);

  h+=`<div class="sec-title" style="margin-top:14px">🏆 Quest Ranking (30d)</div>`;
  questStats.forEach((qs,i)=>{
    const cat=getCat(qs.quest.category);
    const qEmoji=qs.quest.emoji||cat.icon;
    const qColor=qs.quest.color||cat.color;
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    h+=`<div class="card" style="padding:10px 14px;margin-bottom:6px;border-left:3px solid ${qColor}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12px;color:var(--text)">${medal} ${qEmoji} ${qs.quest.title}</span>
        <span style="font-size:14px;font-weight:800;color:${qs.pct>=80?'var(--success)':qs.pct>=50?'var(--gold)':'var(--danger)'}">${qs.pct}%</span>
      </div>
      <div style="font-size:10px;color:var(--text-dim);margin-top:2px">${qs.done}/${qs.possible} dage · 🔥 ${qs.streak}d streak</div>
    </div>`;
  });

  // Suggestions
  const worst=questStats.filter(q=>q.pct<50);
  if(worst.length>0){
    h+=`<div class="sec-title" style="margin-top:14px">💡 Forslag</div><div class="card">`;
    worst.forEach(qs=>{
      h+=`<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:11px;color:var(--text-dim);line-height:1.5">
        <strong style="color:var(--danger)">${qs.quest.title}</strong> har kun ${qs.pct}% completion.
        ${qs.pct<25?'Overvej at gøre den lettere (2-min version) eller fjerne den midlertidigt.':'Prøv at tilføje en stærkere trigger eller belønning.'}
      </div>`;
    });
    h+=`</div>`;
  }

  return h;
}

function renderCalendar() {
  if(!S.calRange) S.calRange = 7;
  const range = S.calRange;
  const now = new Date();

  // Range toggle
  let h=`<div style="display:flex;gap:6px;margin-bottom:14px">
    <button class="tab ${range===7?'active':''}" onclick="S.calRange=7;render()" style="flex:1;text-align:center">7 Dage</button>
    <button class="tab ${range===30?'active':''}" onclick="S.calRange=30;render()" style="flex:1;text-align:center">30 Dage</button>
  </div>`;

  // Summary stats for period
  let totalDone=0, totalPossible=0, perfectDaysInRange=0;
  for(let i=0;i<range;i++){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    const doneList=S.completedDates[ds]||[];
    const possible=S.quests.filter(q=>q.days.includes(d.getDay())&&q.active).length;
    totalDone+=doneList.length; totalPossible+=possible;
    if(possible>0 && doneList.length>=possible) perfectDaysInRange++;
  }
  const overallPct = totalPossible ? Math.round(totalDone/totalPossible*100) : 0;

  h+=`<div class="card" style="border-color:${overallPct>=80?'rgba(78,205,196,.25)':overallPct>=50?'rgba(212,163,64,.25)':'rgba(232,93,74,.25)'}">
    <div style="display:flex;justify-content:space-around;text-align:center">
      <div><div style="font-size:24px;font-weight:800;color:${overallPct>=80?'var(--success)':overallPct>=50?'var(--gold)':'var(--danger)'}">${overallPct}%</div><div style="font-size:10px;color:var(--text-dim)">Completion</div></div>
      <div><div style="font-size:24px;font-weight:800;color:var(--gold-light)">${totalDone}</div><div style="font-size:10px;color:var(--text-dim)">Quests Done</div></div>
      <div><div style="font-size:24px;font-weight:800;color:var(--accent-light)">${perfectDaysInRange}</div><div style="font-size:10px;color:var(--text-dim)">Perfect Days</div></div>
    </div></div>`;

  // Heatmap
  h+=`<div class="sec-title">\uD83D\uDCC5 Heatmap</div>`;
  h+=`<div class="heatmap">`;
  DAY_NAMES.forEach(d=>h+=`<div class="hm-label">${d}</div>`);
  const heatDays = Math.min(range, 35);
  for(let i=heatDays-1;i>=0;i--){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    const completed=(S.completedDates[ds]||[]).length;
    const possible=S.quests.filter(q=>q.days.includes(d.getDay())&&q.active).length;
    const ratio=possible?completed/possible:0;
    const cls=ratio===0?'hm-empty':ratio<.33?'hm-low':ratio<.66?'hm-mid':ratio<1?'hm-high':'hm-full';
    h+=`<div class="hm-cell ${cls}" title="${ds}: ${completed}/${possible}">${d.getDate()}</div>`;
  }
  h+=`</div>`;

  // Per-day breakdown (scrollable list)
  h+=`<div class="sec-title" style="margin-top:14px">\uD83D\uDCCB Dag-for-dag</div>`;
  const MONTH_NAMES=['Jan','Feb','Mar','Apr','Maj','Jun','Jul','Aug','Sep','Okt','Nov','Dec'];
  for(let i=0;i<range;i++){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    const doneList=S.completedDates[ds]||[];
    const dayQuests=S.quests.filter(q=>q.days.includes(d.getDay())&&q.active);
    if(dayQuests.length===0) continue;
    const allDone=doneList.length>=dayQuests.length;
    const pct=dayQuests.length?Math.round(doneList.length/dayQuests.length*100):0;
    const isToday=i===0;

    h+=`<div class="card" style="padding:10px 14px;margin-bottom:8px;border-color:${allDone?'rgba(78,205,196,.2)':isToday?'rgba(212,163,64,.2)':'var(--border)'}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${dayQuests.length>0?'6':'0'}px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:12px;font-weight:700;color:${isToday?'var(--gold-light)':'var(--text-bright)'}">${isToday?'I dag':DAY_NAMES[d.getDay()]} ${d.getDate()}. ${MONTH_NAMES[d.getMonth()]}</span>
          ${allDone?'<span style="font-size:10px;color:var(--success);font-weight:600">✓ PERFECT</span>':''}
        </div>
        <span style="font-size:12px;font-weight:700;color:${pct>=100?'var(--success)':pct>=50?'var(--gold)':'var(--danger)'}">${doneList.length}/${dayQuests.length}</span>
      </div>`;

    dayQuests.forEach(q=>{
      const cat=getCat(q.category);
      const done=doneList.includes(q.id);
      h+=`<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px">
        <span style="color:${done?'var(--success)':'var(--text-dim)'}">${done?'✓':'○'}</span>
        <span style="color:${cat.color};font-size:10px">${cat.icon}</span>
        <span style="color:${done?'var(--text)':'var(--text-dim)'};${done?'':'opacity:.5'}">${q.title}</span>
      </div>`;
    });
    h+=`</div>`;
  }

  // Streak Overview
  h+=`<div class="sec-title" style="margin-top:14px">\uD83D\uDD25 Streak Overview</div><div class="card">`;
  S.quests.filter(q=>q.active).forEach(q=>{
    const cat=getCat(q.category);
    const streak=S.questStreaks[q.id]||0;
    const best=S.questBestStreaks[q.id]||0;
    const mult=streakMultiplier(streak);
    h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:6px">
        <span style="color:${cat.color};font-size:12px">${cat.icon}</span>
        <span style="font-size:12px;color:var(--text)">${q.title}</span></div>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:11px;color:${streak>=7?'#ff6600':'var(--text-dim)'}">\uD83D\uDD25${streak}d</span>
        ${mult>1?`<span style="font-size:10px;color:var(--gold);font-weight:700">${streakLabel(mult)}</span>`:''}
        <span style="font-size:10px;color:var(--text-dim)">Best:${best}d</span>
      </div></div>`;
  });
  h+=`</div>`;

  // Per-category breakdown for period
  h+=`<div class="sec-title" style="margin-top:14px">📊 Kategori Stats (${range}d)</div>`;
  CATS.forEach(cat=>{
    let catDone=0, catTotal=0;
    for(let i=0;i<range;i++){
      const d=new Date(now); d.setDate(d.getDate()-i);
      const ds=d.toISOString().slice(0,10);
      const doneList=S.completedDates[ds]||[];
      const catQuests=S.quests.filter(q=>q.category===cat.id&&q.days.includes(d.getDay())&&q.active);
      catTotal+=catQuests.length;
      catDone+=catQuests.filter(q=>doneList.includes(q.id)).length;
    }
    const pct=catTotal?Math.round(catDone/catTotal*100):0;
    h+=`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:14px">${cat.icon}</span>
      <span style="flex:1;font-size:12px;color:var(--text)">${cat.name}</span>
      <div style="width:80px;height:6px;background:rgba(0,0,0,.3);border-radius:3px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:${cat.color};border-radius:3px;transition:width .5s"></div></div>
      <span style="font-size:12px;font-weight:700;color:${cat.color};min-width:36px;text-align:right">${pct}%</span>
    </div>`;
  });

  return h;
}

// ── Manage (with drag-to-reorder) ──
var _dragState = null;
function initDragReorder() {
  document.addEventListener('touchmove', function(e){
    if(!_dragState) return;
    e.preventDefault();
    var touch = e.touches[0];
    var ghost = document.getElementById('drag-ghost');
    if(ghost) { ghost.style.top = (touch.clientY - _dragState.offsetY) + 'px'; }
    // Find which element we're hovering over
    var els = document.querySelectorAll('.mi-drag[data-qid]');
    for(var i=0; i<els.length; i++){
      var rect = els[i].getBoundingClientRect();
      if(touch.clientY > rect.top && touch.clientY < rect.bottom && els[i].dataset.period === _dragState.period){
        var hoverId = parseInt(els[i].dataset.qid);
        if(hoverId !== _dragState.currentHover){
          _dragState.currentHover = hoverId;
          // Swap in array
          var fromIdx = S.quests.findIndex(function(q){ return q.id===_dragState.qid; });
          var toIdx = S.quests.findIndex(function(q){ return q.id===hoverId; });
          if(fromIdx>=0 && toIdx>=0 && fromIdx!==toIdx){
            var tmp = S.quests.splice(fromIdx, 1)[0];
            S.quests.splice(toIdx, 0, tmp);
            // Re-render the list without killing drag
            renderManageList();
          }
        }
        break;
      }
    }
  }, {passive:false});
  document.addEventListener('touchend', function(){
    if(!_dragState) return;
    var ghost = document.getElementById('drag-ghost');
    if(ghost) ghost.remove();
    document.querySelectorAll('.mi-drag').forEach(function(el){ el.style.opacity='1'; });
    _dragState = null;
    save();
  });
  // Mouse drag support (desktop)
  document.addEventListener('mousemove', function(e){
    if(!_dragState || !_dragState.isMouse) return;
    var ghost = document.getElementById('drag-ghost');
    if(ghost) { ghost.style.top = (e.clientY - _dragState.offsetY) + 'px'; }
    var els = document.querySelectorAll('.mi-drag[data-qid]');
    for(var i=0; i<els.length; i++){
      var rect = els[i].getBoundingClientRect();
      if(e.clientY > rect.top && e.clientY < rect.bottom && els[i].dataset.period === _dragState.period){
        var hoverId = parseInt(els[i].dataset.qid);
        if(hoverId !== _dragState.currentHover){
          _dragState.currentHover = hoverId;
          var fromIdx = S.quests.findIndex(function(q){ return q.id===_dragState.qid; });
          var toIdx = S.quests.findIndex(function(q){ return q.id===hoverId; });
          if(fromIdx>=0 && toIdx>=0 && fromIdx!==toIdx){
            var tmp = S.quests.splice(fromIdx, 1)[0];
            S.quests.splice(toIdx, 0, tmp);
            renderManageList();
          }
        }
        break;
      }
    }
  });
  document.addEventListener('mouseup', function(){
    if(!_dragState || !_dragState.isMouse) return;
    var ghost = document.getElementById('drag-ghost');
    if(ghost) ghost.remove();
    document.querySelectorAll('.mi-drag').forEach(function(el){ el.style.opacity='1'; });
    _dragState = null;
    save();
  });
}
function startDrag(qId, period, e) {
  var isTouch = e.type==='touchstart';
  var clientY = isTouch ? e.touches[0].clientY : e.clientY;
  var el = e.target.closest('.mi-drag');
  if(!el) return;
  var rect = el.getBoundingClientRect();
  _dragState = { qid: qId, period: period, offsetY: clientY - rect.top, currentHover: qId, isMouse: !isTouch };
  // Create ghost
  var ghost = document.createElement('div');
  ghost.id = 'drag-ghost';
  ghost.style.cssText = 'position:fixed;left:'+rect.left+'px;top:'+rect.top+'px;width:'+rect.width+'px;padding:10px 14px;background:var(--bg-card);border:2px solid var(--gold);border-radius:10px;z-index:9999;opacity:.85;pointer-events:none;font-size:12px;color:var(--text-bright);box-shadow:0 8px 24px rgba(0,0,0,.4)';
  var q = S.quests.find(function(x){ return x.id===qId; });
  ghost.textContent = (q ? q.title : '');
  document.body.appendChild(ghost);
  el.style.opacity = '0.3';
}
function renderManageList() {
  var container = document.getElementById('manage-list');
  if(!container) return;
  var h = '';
  var periods = [
    {id:'morning', label:'Morgen', icon:'\uD83C\uDF05'},
    {id:'midday', label:'Middag', icon:'\u2600\uFE0F'},
    {id:'evening', label:'Aften', icon:'\uD83C\uDF19'}
  ];
  periods.forEach(function(per){
    var pQuests = S.quests.filter(function(q){ return q.period===per.id; });
    if(!pQuests.length) return;
    h+='<div style="margin-top:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px">';
    h+='<span style="font-size:16px">'+per.icon+'</span>';
    h+='<span style="font-size:13px;font-weight:700;color:var(--gold-light)">'+per.label+'</span>';
    h+='<span style="font-size:10px;color:var(--text-dim)">('+pQuests.length+' quests)</span>';
    h+='</div>';
    pQuests.forEach(function(q){
      var cat=getCat(q.category);
      var qEmoji=q.emoji||cat.icon;
      var qColor=q.color||cat.color;
      h+='<div class="mi mi-drag '+(q.active?'':'off')+'" data-qid="'+q.id+'" data-period="'+per.id+'" style="border-left:3px solid '+qColor+';display:flex;align-items:center;gap:8px;touch-action:none;user-select:none">';
      // Drag handle
      h+='<div class="drag-handle" ontouchstart="startDrag('+q.id+',\''+per.id+'\',event)" onmousedown="startDrag('+q.id+',\''+per.id+'\',event)" style="cursor:grab;color:var(--text-dim);font-size:16px;padding:4px 2px;min-width:20px;text-align:center">\u2630</div>';
      // Toggle active
      h+='<div class="mi-tog" style="border-color:'+qColor+';'+(q.active?'background:'+qColor:'')+'" onclick="toggleQuestActive('+q.id+')">';
      h+=(q.active?'<span style="color:#fff;font-size:11px">\u2713</span>':'');
      h+='</div>';
      // Info
      h+='<div class="mi-info" style="flex:1"><div class="mi-nm">'+qEmoji+' '+q.title+'</div>';
      h+='<div class="mi-meta">'+q.days.map(function(d){return DAY_NAMES[d]}).join(',')+' \u00B7 +'+q.xp+' XP</div></div>';
      // Edit button
      h+='<button class="qi-edit" onclick="editQuest(S.quests.find(function(x){return x.id==='+q.id+'}))">Rediger</button>';
      h+='</div>';
    });
  });
  container.innerHTML = h;
}
function renderManage() {
  var h='<div style="padding:16px 0">';
  h+='<button style="background:none;border:none;color:var(--text-dim);font-size:13px;cursor:pointer;padding:4px 0;margin-bottom:8px" onclick="setView(\'settings\')">← Tilbage til Settings</button>';

  h+='<div id="manage-list"></div>';

}

    <div class="tab ${S.subView==='scorecard'?'active':''}" onclick="setSubView('scorecard')">Scorecard</div>

function renderDiagnostics() {

  const red = diags.filter(d=>d.overallStatus==='red').length;

  const green = diags.filter(d=>d.overallStatus==='green').length;

  let h=`<div class="sec-title">\uD83D\uDDA5\uFE0F System Diagnostics</div>`;
  h+=`<div class="card" style="border-color:rgba(0,200,255,.2)">

function renderScorecard() {
  let h=`<div class="sec-title">\uD83D\uDCCB Habit Scorecard</div>
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:14px;line-height:1.5">
      James Clear's Habit Scorecard: Rate each quest's habit design across the 4 laws.
      Green = solid. Yellow = needs work. Red = critical gap.
    </div>`;

  const diags = getAllDiagnostics();
  h+=`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">
    <tr style="border-bottom:1px solid var(--border)">
      <th style="text-align:left;padding:8px 6px;color:var(--text-dim)">Quest</th>
      <th style="text-align:center;padding:8px 4px;color:#4ecdc4">L1\nObvious</th>
      <th style="text-align:center;padding:8px 4px;color:#d4a340">L2\nAttractive</th>
      <th style="text-align:center;padding:8px 4px;color:#7b68ee">L3\nEasy</th>
      <th style="text-align:center;padding:8px 4px;color:#e85d4a">L4\nSatisfying</th>
    </tr>`;

  diags.forEach(d=>{
    const cat=getCat(d.quest.category);
    h+=`<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:8px 6px;color:var(--text)">${cat.icon} ${d.quest.title}</td>`;
    // Map issues to laws
    const lawMap = {};
    d.issues.forEach(i=>{
      if(i.law.includes('Law 1')||i.law.includes('Obvious')) lawMap['l1']=i.status;
      else if(i.law.includes('Law 2')||i.law.includes('Attractive')) lawMap['l2']=i.status;
      else if(i.law.includes('Law 3')||i.law.includes('Easy')) lawMap['l3']=i.status;
      else if(i.law.includes('Law 4')||i.law.includes('Satisfying')) lawMap['l4']=i.status;
    });
    ['l1','l2','l3','l4'].forEach(l=>{
      const s=lawMap[l]||'yellow';
      const dot=s==='green'?'\uD83D\uDFE2':s==='yellow'?'\uD83D\uDFE1':'\uD83D\uDD34';
      h+=`<td style="text-align:center;padding:8px 4px">${dot}</td>`;
    });
    h+=`</tr>`;
  });
  h+=`</table></div>`;

  // Overall score
  const total = diags.reduce((sum,d)=>sum+d.issues.filter(i=>i.status==='green').length, 0);
  const max = diags.reduce((sum,d)=>sum+d.issues.length, 0);
  const pct = max > 0 ? Math.round(total/max*100) : 0;
  h+=`<div class="card" style="margin-top:14px;text-align:center;border-color:${pct>=80?'var(--success)':pct>=50?'var(--gold)':'var(--danger)'}33">
    <div style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px">Overall Habit Health</div>
    <div style="font-size:32px;font-weight:800;color:${pct>=80?'var(--success)':pct>=50?'var(--gold)':'var(--danger)'};margin:4px 0">${pct}%</div>
    <div style="font-size:11px;color:var(--text-dim)">${total} af ${max} habit-faktorer er sunde</div></div>`;

  return h;
}

function logMeditation() {
  const min=parseInt(document.getElementById('med_min').value)||0;
  if(min<1){notify('⚠ Indtast antal minutter','boss');return;}
  const type=document.getElementById('med_type').value;
  const notes=document.getElementById('med_notes').value.trim();
  if(!S.meditationLog) S.meditationLog=[];
  S.meditationLog.push({date:todayStr,minutes:min,type,notes,hours:Math.round(min/60*100)/100});

// ── Monthly Matrix View ──
function renderMonthlyMatrix() {
  const now=new Date();
  const year=now.getFullYear(),month=now.getMonth();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const _mNames=['Januar','Februar','Marts','April','Maj','Juni','Juli','August','September','Oktober','November','December'];

  let h=`<div class="sec-title">📅 Månedsoversigt — ${_mNames[month]} ${year}</div>`;

  // Summary bar
  let totalDone=0,totalPossible=0;
  for(let d=1;d<=Math.min(now.getDate(),daysInMonth);d++){
    const dt=new Date(year,month,d);
    const ds=dt.toISOString().slice(0,10);
    const doneList=S.completedDates[ds]||[];
    const possible=S.quests.filter(q=>q.days.includes(dt.getDay())&&q.active).length;
    totalDone+=doneList.length;totalPossible+=possible;
  }
  const monthPct=totalPossible?Math.round(totalDone/totalPossible*100):0;

  h+=`<div class="card" style="text-align:center;margin-bottom:14px">
    <div style="font-size:32px;font-weight:800;color:${monthPct>=80?'var(--success)':monthPct>=50?'var(--gold)':'var(--danger)'}">${monthPct}%</div>
    <div style="font-size:10px;color:var(--text-dim)">Completion denne måned (${totalDone}/${totalPossible})</div>
  </div>`;

  // Calendar grid with heatmap
  h+=`<div class="heatmap" style="grid-template-columns:repeat(7,1fr);gap:4px">`;
  DAY_NAMES.forEach(d=>h+=`<div class="hm-label">${d}</div>`);

  // Pad start
  const firstDow=new Date(year,month,1).getDay();
  for(let i=0;i<firstDow;i++) h+=`<div></div>`;

  for(let d=1;d<=daysInMonth;d++){
    const dt=new Date(year,month,d);
    const ds=dt.toISOString().slice(0,10);
    const doneList=S.completedDates[ds]||[];
    const possible=S.quests.filter(q=>q.days.includes(dt.getDay())&&q.active).length;
    const ratio=possible?doneList.length/possible:0;
    const isToday=d===now.getDate();
    const isFuture=d>now.getDate();
    const cls=isFuture?'hm-future':ratio===0?'hm-empty':ratio<.33?'hm-low':ratio<.66?'hm-mid':ratio<1?'hm-high':'hm-full';
    h+=`<div class="hm-cell ${cls}" style="${isToday?'border:2px solid var(--gold);font-weight:700':''}" title="${ds}: ${doneList.length}/${possible}">${d}</div>`;
  }
  h+=`</div>`;

  // Per-quest monthly stats
  h+=`<div class="sec-title" style="margin-top:14px">📈 Quest Rapport — Denne Måned</div>`;
  S.quests.filter(q=>q.active).forEach(q=>{
    const cat=getCat(q.category);
    const qEmoji=q.emoji||cat.icon;
    const qColor=q.color||cat.color;
    let done=0,possible=0;
    for(let d=1;d<=Math.min(now.getDate(),daysInMonth);d++){
      const dt=new Date(year,month,d);
      if(!q.days.includes(dt.getDay())) continue;
      possible++;
      const ds=dt.toISOString().slice(0,10);
      if((S.completedDates[ds]||[]).includes(q.id)) done++;
    }
    const pct=possible?Math.round(done/possible*100):0;
    const streak=S.questStreaks[q.id]||0;
    const best=S.questBestStreaks[q.id]||0;
    h+=`<div class="card" style="padding:10px 14px;margin-bottom:8px;border-left:3px solid ${qColor}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:12px;font-weight:600;color:var(--text)">${qEmoji} ${q.title}</span>
        <span style="font-size:14px;font-weight:800;color:${pct>=80?'var(--success)':pct>=50?'var(--gold)':'var(--danger)'}">${pct}%</span>
      </div>
      <div style="display:flex;gap:12px;font-size:10px;color:var(--text-dim)">
        <span>${done}/${possible} dage</span>
        <span>🔥 Streak: ${streak}d</span>
        <span>Best: ${best}d</span>
      </div>
      ${xpBar(done,possible||1,qColor,5)}
    </div>`;
  });

  return h;
}

// ── #5: Habit Difficulty Scaling ──
function getScaledXp(quest) {
  const streak=S.questStreaks[quest.id]||0;
  const mult=streakMultiplier(streak);
  // Permanent scaling: after 30-day best streak, quest gives 1.2x base XP
  const best=S.questBestStreaks[quest.id]||0;
  let permMult=1;
  if(best>=90) permMult=1.5;
  else if(best>=60) permMult=1.4;
  else if(best>=30) permMult=1.3;
  else if(best>=14) permMult=1.2;
  else if(best>=7) permMult=1.1;
  return Math.floor(quest.xp * mult * permMult);
}
